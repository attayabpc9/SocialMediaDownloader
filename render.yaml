services:
  - type: web
    name: vidzflow-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --access-logfile - app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vidzflow-db
          property: connectionString
      - key: VIDZFLOW_SECRET_KEY
        sync: false
      - key: VIDZFLOW_MAX_REQUEST_BYTES
        value: "65536"

  - type: worker
    name: vidzflow-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vidzflow-db
          property: connectionString
      - key: VIDZFLOW_SECRET_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PRESIGNED_URL_SECONDS
        value: "1800"
      - key: JOB_RETENTION_SECONDS
        value: "1800"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "300"
      - key: WORKER_POLL_SECONDS
        value: "2"
      - key: WORKER_JOB_TIMEOUT_SECONDS
        value: "900"
      - key: WORKER_MAX_ATTEMPTS
        value: "3"
      - key: MAX_DOWNLOAD_BYTES
        value: "524288000"

databases:
  - name: vidzflow-db
    plan: starter
